<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990">
  <defs>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="white" stroke="#344054" stroke-width="1.4"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #000000; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #333333; }
      .boundary { fill: #FFFFFF; stroke: #000000; stroke-width: 1.7; }
      .boundary-label { font: 700 16px Arial, sans-serif; fill: #000000; }
      .usecase { fill: #FFFFFF; stroke: #000000; stroke-width: 1.5; }
      .uc-code { font: 700 12.5px Arial, sans-serif; fill: #000000; }
      .uc-title { font: 600 15px Arial, sans-serif; fill: #000000; }
      .actor { fill: white; stroke: #000000; stroke-width: 1.8; stroke-linecap: round; }
      .actor-label { font: 700 15px Arial, sans-serif; fill: #000000; }
      .assoc { fill: none; stroke: #444444; stroke-width: 1.4; }
      .dependency { fill: none; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 8 6; marker-end: url(#open-arrow); }
      .stereotype { font: italic 13px Arial, sans-serif; fill: #000000; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
      .condition { font: 11.5px Arial, sans-serif; fill: #444444; }
      .footer { font: 12px Arial, sans-serif; fill: #000000; }
    </style>
  </defs>
  <rect x="0" y="0" width="1400" height="990" fill="white"/>
  <text x="70" y="54" class="title">UML Use-Case Diagram</text>
  <text x="70" y="82" class="subtitle">Airport Lost Luggage Claim &amp; Tracking Portal | PES1UG24CS579 | Lab 1</text>
  <line x1="70" y1="101" x2="1330" y2="101" stroke="#777777" stroke-width="1"/>

  <rect x="270" y="125" width="860" height="730" class="boundary"/>
  <text x="292" y="155" class="boundary-label">Airport Lost Luggage Portal</text>

  <!-- Actor associations are drawn first so use-case fills mask routed lines cleanly. -->
  <path d="M 145 225 L 338 230" class="assoc"/>
  <path d="M 145 250 L 260 250 L 338 380" class="assoc"/>
  <path d="M 145 555 L 250 555 L 250 480 L 700 480 L 775 430" class="assoc"/>
  <path d="M 145 585 L 338 570" class="assoc"/>
  <path d="M 145 615 L 280 655 L 338 705" class="assoc"/>
  <path d="M 1255 215 L 1054 230" class="assoc"/>
  <path d="M 1255 245 L 1160 320 L 700 320 L 620 365" class="assoc"/>
  <path d="M 1255 595 L 1170 790 L 660 790 L 610 750" class="assoc"/>

  <!-- Actors -->
  <circle cx="115" cy="185" r="15" class="actor"/>
<line x1="115" y1="200" x2="115" y2="255" class="actor"/>
<line x1="88" y1="222" x2="142" y2="222" class="actor"/>
<line x1="115" y1="255" x2="91" y2="289" class="actor"/>
<line x1="115" y1="255" x2="139" y2="289" class="actor"/>
<text x="115" y="313" text-anchor="middle" class="actor-label">Passenger</text>
  <circle cx="115" cy="515" r="15" class="actor"/>
<line x1="115" y1="530" x2="115" y2="585" class="actor"/>
<line x1="88" y1="552" x2="142" y2="552" class="actor"/>
<line x1="115" y1="585" x2="91" y2="619" class="actor"/>
<line x1="115" y1="585" x2="139" y2="619" class="actor"/>
<text x="115" y="643" text-anchor="middle" class="actor-label">Baggage Service</text>
<text x="115" y="663" text-anchor="middle" class="actor-label">Agent</text>
  <circle cx="1285" cy="175" r="15" class="actor"/>
<line x1="1285" y1="190" x2="1285" y2="245" class="actor"/>
<line x1="1258" y1="212" x2="1312" y2="212" class="actor"/>
<line x1="1285" y1="245" x2="1261" y2="279" class="actor"/>
<line x1="1285" y1="245" x2="1309" y2="279" class="actor"/>
<text x="1285" y="303" text-anchor="middle" class="actor-label">Airport Baggage</text>
<text x="1285" y="323" text-anchor="middle" class="actor-label">Scan Network</text>
  <circle cx="1285" cy="555" r="15" class="actor"/>
<line x1="1285" y1="570" x2="1285" y2="625" class="actor"/>
<line x1="1258" y1="592" x2="1312" y2="592" class="actor"/>
<line x1="1285" y1="625" x2="1261" y2="659" class="actor"/>
<line x1="1285" y1="625" x2="1309" y2="659" class="actor"/>
<text x="1285" y="683" text-anchor="middle" class="actor-label">Compensation</text>
<text x="1285" y="703" text-anchor="middle" class="actor-label">Payment Service</text>

  <!-- Use cases -->
  <ellipse cx="480" cy="230" rx="145" ry="54" class="usecase"/>
<text x="480" y="216" text-anchor="middle" class="uc-code">UC-01</text>
<text x="480" y="238" text-anchor="middle" class="uc-title">Submit Lost</text>
<text x="480" y="256" text-anchor="middle" class="uc-title">Luggage Claim</text>
  <ellipse cx="910" cy="230" rx="145" ry="54" class="usecase"/>
<text x="910" y="216" text-anchor="middle" class="uc-code">UC-02</text>
<text x="910" y="238" text-anchor="middle" class="uc-title">Cross-reference</text>
<text x="910" y="256" text-anchor="middle" class="uc-title">Bag Scan Logs</text>
  <ellipse cx="480" cy="395" rx="145" ry="54" class="usecase"/>
<text x="480" y="381" text-anchor="middle" class="uc-code">UC-03</text>
<text x="480" y="403" text-anchor="middle" class="uc-title">Track Claim &amp;</text>
<text x="480" y="421" text-anchor="middle" class="uc-title">Bag Timeline</text>
  <ellipse cx="910" cy="395" rx="145" ry="54" class="usecase"/>
<text x="910" y="381" text-anchor="middle" class="uc-code">UC-04</text>
<text x="910" y="403" text-anchor="middle" class="uc-title">Investigate &amp;</text>
<text x="910" y="421" text-anchor="middle" class="uc-title">Update Claim</text>
  <ellipse cx="480" cy="560" rx="145" ry="54" class="usecase"/>
<text x="480" y="556" text-anchor="middle" class="uc-code">UC-05</text>
<text x="480" y="578" text-anchor="middle" class="uc-title">Arrange Bag Return</text>
  <ellipse cx="910" cy="560" rx="145" ry="54" class="usecase"/>
