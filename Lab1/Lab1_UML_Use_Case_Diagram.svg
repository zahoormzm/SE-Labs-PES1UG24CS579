<text x="910" y="568" text-anchor="middle" class="uc-title">Assess Compensation</text>
<text x="910" y="586" text-anchor="middle" class="uc-title">Eligibility</text>
  <ellipse cx="480" cy="715" rx="145" ry="54" class="usecase"/>
<text x="480" y="711" text-anchor="middle" class="uc-code">UC-07</text>
<text x="480" y="733" text-anchor="middle" class="uc-title">Process Compensation</text>
  <ellipse cx="910" cy="715" rx="145" ry="54" class="usecase"/>
<text x="910" y="701" text-anchor="middle" class="uc-code">UC-08</text>
<text x="910" y="723" text-anchor="middle" class="uc-title">Send Status</text>
<text x="910" y="741" text-anchor="middle" class="uc-title">Notification</text>

  <!-- Include / extend relationships -->
  <path d="M 625 230 L 765 230" class="dependency"/>
  <text x="695" y="215" text-anchor="middle" class="stereotype">«include»</text>

  <path d="M 765 395 L 625 395" class="dependency"/>
  <text x="695" y="382" text-anchor="middle" class="stereotype">«include»</text>

  <path d="M 575 519 C 700 500, 770 465, 820 439" class="dependency"/>
  <text x="700" y="484" text-anchor="middle" class="stereotype">«extend»</text>
  <text x="700" y="504" text-anchor="middle" class="condition">[bag recovered]</text>

  <path d="M 580 677 C 700 645, 765 610, 820 585" class="dependency"/>
  <text x="695" y="627" text-anchor="middle" class="stereotype">«include»</text>

  <path d="M 1030 425 L 1080 630 L 1018 680" class="dependency"/>
  <text x="1060" y="603" text-anchor="end" class="stereotype">«include»</text>

  <line x1="70" y1="944" x2="1330" y2="944" stroke="#777777" stroke-width="1"/>
  <text x="70" y="968" class="footer">PES1UG24CS579</text>
  <text x="1330" y="968" text-anchor="end" class="footer">Page 1</text>
</svg>